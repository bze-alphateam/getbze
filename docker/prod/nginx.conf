# In-container nginx serving the Next.js static export (one index.html per route).
# TLS, caching zones and the /api proxy live on the host's front nginx.

# pages must always be revalidated so releases show up instantly; other files keep defaults
map $sent_http_content_type $getbze_cache_control {
    ~^text/html  "no-cache";
    default      "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # unknown paths get the designed 404 page with a real 404 status
    error_page 404 /404.html;

    # hashed Next.js assets are immutable
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $getbze_cache_control;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
