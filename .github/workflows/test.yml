name: test

# Unit tests (vitest + Testing Library, live data mocked) on every pull request
# and on the release branches.
on:
  pull_request:
  push:
    branches: [main, main-v2]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Unit tests
        run: yarn test
